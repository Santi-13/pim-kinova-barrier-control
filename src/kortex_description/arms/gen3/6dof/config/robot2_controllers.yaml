/robot2/controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    robot2_controllers:
      type: velocity_controllers/JointGroupVelocityController

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    fault_controller:
      type: picknik_reset_fault_controller/PicknikResetFaultController

/robot2/robot2_controllers:
  ros__parameters:
    joints:
      - robot2/joint_1
      - robot2/joint_2
      - robot2/joint_3
      - robot2/joint_4
      - robot2/joint_5
      - robot2/joint_6

/robot2/joint_trajectory_controller:
  ros__parameters:
    joints:
      - robot2/joint_1
      - robot2/joint_2
      - robot2/joint_3
      - robot2/joint_4
      - robot2/joint_5
      - robot2/joint_6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 0.0