/robot2/controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    twist_controller:
      type: picknik_twist_controller/PicknikTwistController

    robotiq_gripper_controller:
      type: position_controllers/GripperActionController

    fault_controller:
      type: picknik_reset_fault_controller/PicknikResetFaultController

    joint_group_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

/robot2/joint_trajectory_controller:
  ros__parameters:
    joints:
      - robot2/joint_1
      - robot2/joint_2
      - robot2/joint_3
      - robot2/joint_4
      - robot2/joint_5
      - robot2/joint_6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 0.0

/robot2/twist_controller:
  ros__parameters:
    joint: tcp
    interface_names:
      - twist.linear.x
      - twist.linear.y
      - twist.linear.z
      - twist.angular.x
      - twist.angular.y
      - twist.angular.z

/robot2/robotiq_gripper_controller:
  ros__parameters:
    default: true
    joint: robotiq_85_left_knuckle_joint
    allow_stalling: true

/robot2/joint_group_velocity_controller:
  ros__parameters:
    joints:
      - robot2/joint_1
      - robot2/joint_2
      - robot2/joint_3
      - robot2/joint_4
      - robot2/joint_5
      - robot2/joint_6

